test_subject:
  options_manager: solver_options#options

pylith.petsc.options.solver_options#options:
  solver:
    enabled: True
    options:
      - ts_type, beuler
      - pc_type, gamg

      - pc_gamg_coarse_eq_limit, 200
      - mg_fine_ksp_max_it, 5
  initial_guess:
    enabled: False
    options:
      - ksp_guess_type, pod
      - ksp_guess_pod_size,  8
  tolerances:
    enabled: True
    options:
      - ksp_rtol, 1.0e-12
      - ksp_atol, 1.0e-7
      - snes_rtol, 5.0e-6
      - snes_atol, 5.0e-2
  adaptive_ts:
    enabled: True
    options:
      - ts_adapt_type, basic
      - ts_adapt_safety, 0.2
      - ts_adapt_reject_safety, 0.1
      - ts_atol, 0.05
      - ts_rtol, 0.05

      - ts_adapt_monitor, true
  monitoring:
    enabled: True
    options:
      - ts_monitor
      - ksp_monitor
      - snes_monitor

      - ksp_converged_reason
      - snes_converged_reason

      - ts_error_if_step_fails
      - ksp_error_if_not_converged
      - snes_error_if_not_converged
