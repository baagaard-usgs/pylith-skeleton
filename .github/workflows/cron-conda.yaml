name: cron-conda
# invoke
on:
  # once a week: this workflow guards against drift in {conda-forge}, which moves without any
  # commit to {pylith}, so a merge is the wrong thing to key on; mondays at 07:00 UTC
  schedule:
    - cron: "0 7 * * 1"
  # and manually
  workflow_dispatch:
jobs:
  # build and test the tip of the default branch against a conda-forge toolchain
  build:
    name: >-
      ${{matrix.target}}
      ${{matrix.compiler}}
      on ${{matrix.os}}
    runs-on: ${{matrix.os}}
    # a login shell so the micromamba environment is active in every step
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # the point is to catch a moving toolchain, not to re-test every build variant, so the
        # scheduled run carries {opt} only; {pr-conda} covers {debug}
        target: [opt]
        compiler: [gcc, clang]
        # the conda-forge toolchain packages for each compiler
        include:
          - compiler: gcc
            suite: gcc
            toolchain: gcc gxx
            cc: gcc
            cxx: g++
          - compiler: clang
            suite: clang
            toolchain: clang clangxx
            cc: clang
            cxx: clang++

    env:
      # mm discovers its settings from the {mm.yaml} we install into ~/.pyre below
      mm: python3 ${{github.workspace}}/mm/mm
      target: ${{matrix.target}}
      suite: ${{matrix.suite}}

    steps:
      - name: checkout pylith
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: pylith

      - name: conda-forge environment
        uses: mamba-org/setup-micromamba@v3
        with:
          micromamba-version: latest
          environment-file: pylith/.github/configs/conda.yaml
          # conda-forge only, with strict priority so nothing leaks in from defaults
          condarc: |
            channels:
              - conda-forge
            channel_priority: strict
          # layer the per-matrix toolchain onto the base env
          create-args: >-
            ${{matrix.toolchain}}

      - name: versions
        run: |
          echo " -- conda prefix"
          echo "${CONDA_PREFIX}"
          echo " -- make"
          make --version
          echo " -- C compiler"
          ${{matrix.cc}} --version
          echo " -- C++ compiler"
          ${{matrix.cxx}} --version
          echo " -- python"
          python3 --version
          echo "    -- prefix"
          python3-config --prefix
          echo "    -- includes"
          python3-config --includes
          echo "    -- libs"
          python3-config --libs
          echo " -- platform tag from python"
          python3 -c "import sys; print(sys.platform)"
          echo " -- distribution tag from python"
          python3 -c "import platform; print(platform.freedesktop_os_release().get('PRETTY_NAME'))"

      - name: clone mm and pyre
        run: |
          echo " -- cloning mm"
          git clone --depth 1 https://github.com/aivazis/mm
          echo " -- cloning pyre"
          git clone --depth 1  --branch issue171 https://github.com/pyre/pyre

      - name: configure mm
        run: |
          echo " -- creating the ~/.config/pyre configuration directory"
          mkdir -p ~/.config/pyre
          echo " -- installing the mm configuration as ~/.config/pyre/mm.yaml so mm auto-discovers it"
          cp pylith/.github/configs/conda-mm.yaml ~/.config/pyre/mm.yaml
          echo " -- creating ~/.config/mm"
          mkdir ~/.config/mm
          echo " -- copying the external dependencies configuration file there"
          cp pylith/.github/configs/conda-config.mm ~/.config/mm/config.mm

      - name: package database
        run: |
          echo " -- switching to the pylith source directory"
          cd pylith
          echo " -- host.info"
          ${mm} host.info
          echo " -- make.info"
          ${mm} make.info
          echo " -- discovering the conda packages"
          ${mm} --setup
          echo " -- where the build products will be deposited"
          ${mm} builder.info
          echo " -- the resulting package database"
          ${mm} extern.db.info
          echo " -- the externals, as the make engine reads them back"
          ${mm} extern.info

      - name: pyre mm configuration
        run: |
          cd pyre
          echo " -- checking whether mm can run in the pyre directory"
          echo now at: ${PWD}
          ${mm} --help
          ${mm} host.info
          ${mm} builder.info
          ${mm} make.info
          # and each external that {pyre} actually builds against; a package that is not available
          # is never loaded, so its {info} target does not exist and asking for it is a hard error
          echo " -- the individual packages"
          ${mm} extern.python.info
          ${mm} extern.pybind11.info
          ${mm} extern.hdf5.info
          ${mm} extern.mpi.info
          echo " -- verifying the pyre extension"
          ${mm} pyre.ext.info
          echo " -- verifying the pyre host extension"
          ${mm} pyre-host.ext.info
          echo " -- verifying the journal extension"
          ${mm} journal.ext.info
          echo " -- verifying the h5 extension"
          ${mm} pyre-h5.ext.info

      - name: pylith mm diagnostics
        run: |
          cd pylith
          echo " -- checking whether mm can run in the pylith directory"
          echo now at: ${PWD}
          ${mm} builder.info
          # and each external that {pyre} actually builds against; a package that is not available
          # is never loaded, so its {info} target does not exist and asking for it is a hard error
          #echo " -- the individual packages"
          #${mm} extern.mpi.info
          #${mm} extern.hdf5.info
          #${mm} extern.pybind11.info
          #echo " -- verifying the pylith extension"
          #${mm} pylith.ext.info
          #echo " -- verifying the pylith host extension"
          #${mm} pylith-host.ext.info
          #echo " -- verifying the journal extension"
          #${mm} journal.ext.info
          #echo " -- verifying the h5 extension"
          #${mm} pylith-h5.ext.info

      - name: build pyre
        run: |
          echo " -- switching to the pyre source directory"
          cd pyre
          echo " -- building pyre into the conda prefix"
          ${mm} --jobs=$(nproc)

      - name: build pylith
        run: |
          echo " -- switching to the pylith source directory"
          cd pylith
          echo " -- building pylith into the conda prefix"
          ${mm} --jobs=$(nproc)

      - name: test pylith
        run: |
          echo " -- switching to the pylith source directory"
          cd pylith
          echo " -- testing pylith"
          ${mm} --jobs=$(nproc) tests


# end of file
