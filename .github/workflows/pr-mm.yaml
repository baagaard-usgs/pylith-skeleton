# Adapted from pyre.


name: pr-mm
on:
  pull_request:

# a new push to a pull request replaces the runs of the commits it supersedes;
# runs for any other event are never cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # build and test the ref that launched this action
  build:
    name: >-
      ${{matrix.target}}
      python-${{matrix.python}}+${{matrix.compiler}}
      on ${{matrix.os}}
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04]
        target: [debug, opt]
        python: ["3.14"]
        compiler: ["gcc-15", "clang-21"]
        # define the names of the compilers
        include:
          - compiler: gcc-15
            suite: gcc
            suiteVersion: 15
            cc: gcc-15
            cxx: g++-15
          - compiler: clang-21
            suite: clang
            suiteVersion: 21
            cc: clang-21
            cxx: clang++-21

    steps:
      - name: ${{matrix.os}} refresh
        run: |
          echo " -- update the package cache"
          sudo apt update
          echo " -- upgradables"
          sudo apt list --upgradable
          echo " -- upgrade"
          sudo apt dist-upgrade
          echo " -- install our dependencies"
          sudo apt install -y openssh-server libgsl-dev libopenmpi-dev libhdf5-dev

      - name: runner information
        run: |
          echo " -- runner home"
          pwd

      - name: python ${{matrix.python}} setup
        # installs pythonX.XX-dev
        # defines pythonVersion, pythonLocation
        uses: actions/setup-python@v7
        with:
          python-version: ${{matrix.python}}

      - name: install dependencies
        run: |
          python${pythonVersion} -m pip install --upgrade pip
          pip3 install pybind11 PyYAML ruamel.yaml pytest
        env:
          pythonVersion: ${{matrix.python}}

      - name: list system packages
        run: |
          dpkg -l

      - name: versions
        run: |
          echo " -- platform tag from python"
          python${pythonVersion} -c "import sys; print(sys.platform)"
          echo " -- distribution tag from python"
          python${pythonVersion} -c "import platform; print(platform.freedesktop_os_release().get('PRETTY_NAME'))"
          echo " -- make"
          make --version
          echo " -- C compiler"
          ${{matrix.cc}} --version
          echo " -- C++ compiler"
          ${{matrix.cxx}} --version
          echo " -- python"
          python${pythonVersion} --version
          echo "    -- prefix"
          python${pythonVersion}-config --prefix
          echo "    -- includes"
          python${pythonVersion}-config --includes
          echo "    -- libs"
          python${pythonVersion}-config --libs
        env:
          pythonVersion: ${{matrix.python}}

      - name: external dependencies
        run: |
          echo " -- openmpi"
          sudo dpkg-query -L libopenmpi-dev
          echo " -- hdf5"
          sudo dpkg-query -L libhdf5-dev

      - name: locations of python packages
        run: |
          echo " -- pybind11"
          pip3 show pybind11
          echo " -- its headers"
          find ${pythonLocation}/lib/python${pythonVersion}/site-packages/pybind11
          echo " -- yaml"
          pip3 show PyYAML
          echo " -- pytest"
          pip3 show pytest
        env:
          pythonVersion: ${{matrix.python}}

      - name: checkout pylith
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: pylith

      - name: clone mm and pyre
        run: |
          echo " -- cloning mm"
          git clone --depth 1 https://github.com/aivazis/mm
          echo " -- cloning pyre"
          git clone --depth 1 --branch issue171 https://github.com/pyre/pyre

      - name: configure mm
        run: |
          echo " -- creating the ~/.config/pyre configuration directory"
          mkdir -p ~/.config/pyre
          echo " -- installing the mm configuration as ~/.config/pyre/mm.yaml so mm auto-discovers it"
          cp pylith/.github/configs/ubuntu-mm.yaml ~/.config/pyre/mm.yaml
          echo " -- creating ~/.config/mm"
          mkdir ~/.config/mm
          echo " -- copying the external dependencies configuration file there"
          cp pylith/.github/configs/ubuntu-config.mm ~/.config/mm/config.mm

      - name: mm diagnostics
        run: |
          echo " -- switching to the pylith source directory"
          cd pylith
          echo now at: ${PWD}
          echo mm: ${mm}
          ${mm} --help
          echo " -- host.info"
          ${mm} host.info
          echo " -- make.info"
          ${mm} make.info
        env:
          mm: python3 ${{github.workspace}}/mm/mm
          target: ${{matrix.target}}
          suite: ${{matrix.suite}}
          suiteVersion: ${{matrix.suiteVersion}}
          pythonVersion: ${{matrix.python}}

      - name: pyre mm diagnostics
        run: |
          cd pyre
          echo " -- checking whether mm can run in the pyre directory"
          echo now at: ${PWD}
          echo " -- where the build products will be deposited"
          ${mm} builder.info
          echo " -- the externals, as the make engine reads them back"
          ${mm} extern.info
          echo " -- verifying external packages"
          ${mm} extern.mpi.info
          ${mm} extern.hdf5.info
          ${mm} extern.pybind11.info
          echo " -- verifying the pyre extension"
          ${mm} pyre.ext.info
          echo " -- verifying the pyre host extension"
          ${mm} pyre-host.ext.info
          echo " -- verifying the journal extension"
          ${mm} journal.ext.info
          echo " -- verifying the h5 extension"
          ${mm} pyre-h5.ext.info
        env:
          mm: python3 ${{github.workspace}}/mm/mm
          target: ${{matrix.target}}
          suite: ${{matrix.suite}}
          suiteVersion: ${{matrix.suiteVersion}}
          pythonVersion: ${{matrix.python}}

      - name: pylith mm diagnostics
        run: |
          cd pylith
          echo " -- checking whether mm can run in the pylith directory"
          echo now at: ${PWD}
          echo " -- where the build products will be deposited"
          ${mm} builder.info
          echo " -- the externals, as the make engine reads them back"
          ${mm} extern.info
          #echo " -- verifying external packages"
          #${mm} extern.mpi.info
          #${mm} extern.hdf5.info
          #${mm} extern.pybind11.info
          #echo " -- verifying the pyre extension"
          #${mm} pyre.ext.info
          #echo " -- verifying the pyre host extension"
          #${mm} pyre-host.ext.info
          #echo " -- verifying the journal extension"
          #${mm} journal.ext.info
          #echo " -- verifying the h5 extension"
          #${mm} pyre-h5.ext.info
        env:
          mm: python3 ${{github.workspace}}/mm/mm
          target: ${{matrix.target}}
          suite: ${{matrix.suite}}
          suiteVersion: ${{matrix.suiteVersion}}
          pythonVersion: ${{matrix.python}}

      - name: build pyre
        run: |
          echo " -- switching to the pyre source directory"
          cd pyre
          echo " -- building pyre"
          ${mm} --jobs=$(nproc)
        env:
          mm: python3 ${{github.workspace}}/mm/mm
          target: ${{matrix.target}}
          suite: ${{matrix.suite}}
          suiteVersion: ${{matrix.suiteVersion}}
          pythonVersion: ${{matrix.python}}

      - name: build pylith
        run: |
          echo " -- switching to the pylith source directory"
          cd pylith
          echo " -- building pylith"
          ${mm} --jobs=$(nproc)
        env:
          mm: python3 ${{github.workspace}}/mm/mm
          target: ${{matrix.target}}
          suite: ${{matrix.suite}}
          suiteVersion: ${{matrix.suiteVersion}}
          pythonVersion: ${{matrix.python}}

      - name: test pylith
        run: |
          echo " -- switching to the pylith source directory"
          cd pylith
          echo " -- testing pylith"
          ${mm} --jobs=$(nproc) tests
        env:
          mm: python3 ${{github.workspace}}/mm/mm
          target: ${{matrix.target}}
          suite: ${{matrix.suite}}
          suiteVersion: ${{matrix.suiteVersion}}
          pythonVersion: ${{matrix.python}}


# end of file
